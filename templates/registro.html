<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro voluntario | Unión de Ornitólogos de Chile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<main>
    <h1>Registro voluntario</h1>
    <p class="leyenda">Todos los campos son obligatorios.</p>
    <form id="form-registro" method="post" action="{{ url_for('registro') }}" novalidate>
        <p>
            <label for="nombre">Nombre (texto):</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" value="{{ valores.nombre }}">
            <span class="mensaje-error" id="error-nombre">{{ errores.get('nombre', '') }}</span>
        </p>
        <p>
            <label for="correo">Email:</label><br>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.cl" value="{{ valores.correo }}">
            <span class="mensaje-error" id="error-correo">{{ errores.get('correo', '') }}</span>
        </p>
        <p>
            <label for="telefono">Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. +56 9 1234 5678" value="{{ valores.telefono }}">
            <span class="mensaje-error" id="error-telefono">{{ errores.get('telefono', '') }}</span>
        </p>
        <p>
            <label for="region">Región (select):</label><br>
            <select id="region" name="region">
                <option value="">Seleccione una región</option>
                {% for r in regiones %}
                <option value="{{ r.id }}"{% if valores.region == r.id|string %} selected{% endif %}>{{ r.nombre }}</option>
                {% endfor %}
            </select>
            <span class="mensaje-error" id="error-region">{{ errores.get('region', '') }}</span>
        </p>
        <p>
            <label for="comuna">Comuna (select):</label><br>
            <select id="comuna" name="comuna">
                <option value="">Seleccione una comuna</option>
                {% for c in comunas %}
                <option value="{{ c.id }}"{% if valores.comuna == c.id|string %} selected{% endif %}>{{ c.nombre }}</option>
                {% endfor %}
            </select>
            <span class="mensaje-error" id="error-comuna">{{ errores.get('comuna', '') }}</span>
        </p>
        <p>
            <button type="submit" id="btn-registrar">Registrarme</button>
            <input type="reset" value="Limpiar">
        </p>
    </form>

    <p><a href="{{ url_for('inicio') }}">Volver al inicio</a></p>
</main>

<script src="{{ url_for('static', filename='registro-validator.js') }}"></script>
</body>
</html>
