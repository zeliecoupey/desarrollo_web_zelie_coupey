<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
</head>
<body>

    <h1>Registro voluntario</h1>

    <form action="#" method="post">
        <p>
            <label for="nombre">Nombre (texto):</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">
        </p>
        <p>
            <label for="rut">RUT:</label><br>
            <input type="text" id="rut" name="rut" placeholder="Escribe tu RUT">
        </p>
        <p>
            <label for="correo">Email:</label><br>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.cl" >
        </p>
        <p>
            <label for="telefono">Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono" placeholder="Escribe tu teléfono">
        </p>
       
        
        <p>
            <label for="region">Región (select):</label><br>
            <select id="region" name="region">
                <option value="metropolitana">Región Metropolitana</option>
                <option value="biobio">Región del Biobío</option>
                <option value="losrios">Región de Los Ríos</option>
                <option value="santiago">Región de Santiago</option>
            </select>
        </p>
        <p>
            <label for="comuna">Comuna (texto):</label><br>
            <input type="text" id="comuna" name="comuna" placeholder="Escribe tu comuna">
        </p>
        <p>
            <label for="calleynumero">Calle y número (texto):</label><br>
            <input type="text" id="calleynumero" name="calleynumero" placeholder="Escribe tu dirección">
        </p>
       
       
        <p>
            <input type="submit" value="Registrarme">
            <input type="reset" value="Limpiar">
        </p>
    </form>
</body>
</html>
