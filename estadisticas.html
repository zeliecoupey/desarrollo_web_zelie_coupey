<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas | Unión de Ornitólogos de Chile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
    <h1>Estadísticas</h1>
    <p>Indicadores y métricas del sistema. Esta pantalla es solo de consulta: los datos mostrados son ilustrativos.</p>

    <section>
        <h2>Avistamientos por tipo de ave</h2>
        <svg viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Gráfico de torta con el porcentaje de avistamientos por tipo de ave">
            <g transform="translate(90,100) rotate(-90)">
                <circle r="80" fill="none" stroke="#e63946" stroke-width="40" stroke-dasharray="100.53 402.12" stroke-dashoffset="0"></circle>
                <circle r="80" fill="none" stroke="#457b9d" stroke-width="40" stroke-dasharray="125.66 402.12" stroke-dashoffset="-100.53"></circle>
                <circle r="80" fill="none" stroke="#2a9d8f" stroke-width="40" stroke-dasharray="150.80 402.12" stroke-dashoffset="-226.19"></circle>
                <circle r="80" fill="none" stroke="#f4a261" stroke-width="40" stroke-dasharray="75.40 402.12" stroke-dashoffset="-376.99"></circle>
                <circle r="80" fill="none" stroke="#8d99ae" stroke-width="40" stroke-dasharray="50.27 402.12" stroke-dashoffset="-452.39"></circle>
            </g>
            <g font-size="11" font-family="Arial, sans-serif">
                <rect x="190" y="20"  width="12" height="12" fill="#e63946"></rect><text x="207" y="30">Rapaz (20%)</text>
                <rect x="190" y="40"  width="12" height="12" fill="#457b9d"></rect><text x="207" y="50">Acuática (25%)</text>
                <rect x="190" y="60"  width="12" height="12" fill="#2a9d8f"></rect><text x="207" y="70">Paseriforme (30%)</text>
                <rect x="190" y="80"  width="12" height="12" fill="#f4a261"></rect><text x="207" y="90">Psitácido (15%)</text>
                <rect x="190" y="100" width="12" height="12" fill="#8d99ae"></rect><text x="207" y="110">Otro (10%)</text>
            </g>
        </svg>
    </section>

    <section>
        <h2>Voluntarios registrados por mes</h2>
        <svg viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Gráfico de línea con el total de voluntarios registrados acumulados por mes">
            <line x1="40" y1="10" x2="40" y2="160" stroke="#333"></line>
            <line x1="40" y1="160" x2="300" y2="160" stroke="#333"></line>

            <polyline points="60,150 100,135 140,120 180,95 220,70 260,45"
                      fill="none" stroke="#457b9d" stroke-width="3"></polyline>
            <circle cx="60"  cy="150" r="3" fill="#457b9d"></circle>
            <circle cx="100" cy="135" r="3" fill="#457b9d"></circle>
            <circle cx="140" cy="120" r="3" fill="#457b9d"></circle>
            <circle cx="180" cy="95"  r="3" fill="#457b9d"></circle>
            <circle cx="220" cy="70"  r="3" fill="#457b9d"></circle>
            <circle cx="260" cy="45"  r="3" fill="#457b9d"></circle>

            <g font-size="10" font-family="Arial, sans-serif" text-anchor="middle">
                <text x="60"  y="175">Mar</text>
                <text x="100" y="175">Abr</text>
                <text x="140" y="175">May</text>
                <text x="180" y="175">Jun</text>
                <text x="220" y="175">Jul</text>
                <text x="260" y="175">Ago</text>
            </g>
            <text x="10" y="15" font-size="10" font-family="Arial, sans-serif">Total</text>
        </svg>
    </section>

    <section>
        <h2>Avistamientos por región</h2>
        <svg viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Gráfico de barras con el total de avistamientos por región">
            <line x1="40" y1="10" x2="40" y2="160" stroke="#333"></line>
            <line x1="40" y1="160" x2="280" y2="160" stroke="#333"></line>

            <rect x="60"  y="100" width="35" height="60" fill="#e63946"></rect>
            <rect x="120" y="125" width="35" height="35" fill="#2a9d8f"></rect>
            <rect x="180" y="115" width="35" height="45" fill="#457b9d"></rect>
            <rect x="240" y="140" width="35" height="20" fill="#f4a261"></rect>

            <g font-size="10" font-family="Arial, sans-serif" text-anchor="middle">
                <text x="77"  y="175">Metrop.</text>
                <text x="137" y="175">Región VI</text>
                <text x="197" y="175">Región V</text>
                <text x="257" y="175">Los Ríos</text>
            </g>
        </svg>
    </section>

    <p><a href="inicio.html">Volver al inicio</a></p>
</main>

</body>
</html>
